# =============================================================================
# Sentinel-RAG - local orchestration
#
#   docker compose up --build                                    app on :8000
#   docker compose --profile ingest run --rm ingest               rebuild index
#   docker compose --profile eval   run --rm eval --tier retrieval
#   docker compose logs -f backend
#
# One serving container: the web client is static files served by the same
# FastAPI process, so there is no UI container, no Node build, and no
# cross-origin configuration to get wrong.
#
# Qdrant defaults to the managed cloud service. Uncomment the `qdrant` service
# below to run entirely locally.
# =============================================================================

services:
  backend:
    build:
      context: .
      target: backend
    image: sentinel-rag:backend
    container_name: sentinel-rag
    # Secrets are injected at runtime, never baked into the image
    # (.dockerignore keeps .env out of the build context for exactly this reason).
    env_file: .env
    environment:
      LANGSMITH_TRACING: "false"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request,sys
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)
      interval: 30s
      timeout: 5s
      # Generous: NeMo Guardrails and LangGraph import before the socket binds.
      start_period: 90s
      retries: 3

  # One-shot ingestion. Not started by `up` - run it explicitly:
  #   docker compose --profile ingest run --rm ingest DATA/kubernetes --wipe
  # Exits non-zero if any document fails or the index does not reconcile, so a
  # half-finished ingest cannot report success.
  ingest:
    build:
      context: .
      target: ingest
    image: sentinel-rag:ingest
    profiles: ["ingest"]
    env_file: .env
    volumes:
      # DATA/ is excluded from the build context (large, changes independently
      # of the code), so it is mounted read-only at run time instead.
      - ./DATA:/app/DATA:ro
      # The manifest is written here and read back by tooling on the host.
      - ./processed_data:/app/processed_data
    restart: "no"

  # The evaluation suite. Previously excluded from every image, which meant the
  # one thing whose reproducibility the published numbers rest on could not be
  # reproduced with a single command.
  #   docker compose --profile eval run --rm eval --tier retrieval
  eval:
    build:
      context: .
      target: eval
    image: sentinel-rag:eval
    profiles: ["eval"]
    env_file: .env
    environment:
      # Evaluation must never score a cached generation, or a repeat run
      # measures the cache rather than the system.
      GATEWAY_CACHE_ENABLED: "false"
      USE_GATEWAY: "false"
    volumes:
      - ./evals/runs:/app/evals/runs
    restart: "no"
# ---------------------------------------------------------------------------
# Fully local Qdrant. Uncomment, then set in .env:
#   QDRANT_CLUSTER_ENDPOINT=http://qdrant:6333
#   QDRANT_API_KEY=
