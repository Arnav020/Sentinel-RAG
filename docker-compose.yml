# =============================================================================
# Sentinel-RAG — local orchestration
#
#   docker compose up --build                                   app on :8000
#   docker compose --profile ingest run --rm ingest DATA --wipe  one-shot ingest
#   docker compose logs -f backend
#   docker compose down
#
# One service, not two: the web client is static files served by the same
# FastAPI process, so there is no UI container, no Node build, and no
# cross-origin configuration to get wrong.
#
# Qdrant is a managed cloud service, so there is no vector-DB container either.
# =============================================================================

services:
  backend:
    build:
      context: .
      target: backend
    image: sentinel-rag:backend
    container_name: sentinel-rag
    # Secrets are injected at runtime, never baked into the image
    # (.dockerignore keeps .env out of the build context for exactly this reason).
    env_file: .env
    environment:
      # Tracing is opt-in; leaving it on without a key produces noisy 401s.
      LANGSMITH_TRACING: "false"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      # Generous: NeMo Guardrails and LangGraph import before the socket binds.
      start_period: 90s
      retries: 3

  # One-shot ingestion job. Not started by `up` — run it explicitly:
  #   docker compose --profile ingest run --rm ingest DATA --wipe
  ingest:
    build:
      context: .
      target: ingest
    image: sentinel-rag:ingest
    profiles: ["ingest"]
    env_file: .env
    volumes:
      # DATA/ is excluded from the build context (large, changes independently
      # of the code), so it is mounted read-only at run time instead.
      - ./DATA:/app/DATA:ro
      # Chunk metadata written by the processor, surfaced back on the host.
      - ./processed_data:/app/processed_data
    restart: "no"
