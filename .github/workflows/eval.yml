name: Evaluation

# On demand only. The judged tiers cost real tokens and are non-deterministic,
# so they neither gate a pull request nor run on a schedule:
#
#   * A nightly `--tier all` would spend the entire 200k/day Groq budget of
#     every model, every night, on a run nobody asked for - and the provider
#     enforces that cap per model, so it would also block real use.
#   * It needs the production Qdrant index (verify_dataset checks that every
#     gold chunk still exists there), which means live credentials in CI.
#   * It failed every night for two weeks at the first step needing those
#     credentials, and mailed about it every morning.
#
# Results are uploaded as a downloadable artifact. They are NOT auto-committed:
# a bot pushing to main defeats the point of a curated evals/runs/ history.
# Commit a run deliberately, after reading it.
#
# Required repository secrets: QDRANT_CLUSTER_ENDPOINT, QDRANT_API_KEY,
# GROQ_API_KEY (JUDGE_GROQ optional).

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run (retrieval is free and deterministic)
        type: choice
        default: retrieval
        options: [retrieval, behaviour, ragas, all]
      pace:
        description: Extra seconds between items (0 = throttle on measured token spend only)
        default: "0"

permissions:
  contents: read

jobs:
  evaluate:
    name: Run evaluation suite
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      QDRANT_CLUSTER_ENDPOINT: ${{ secrets.QDRANT_CLUSTER_ENDPOINT }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # A separate key for the judge keeps eval traffic off the serving budget
      # where the provider supports it; it falls back to GROQ_API_KEY.
      JUDGE_GROQ: ${{ secrets.JUDGE_GROQ }}
      LOGFIRE_ENABLED: "false"
      LANGSMITH_TRACING: "false"
      # Evaluation must never score a cached generation, or a repeat run grades
      # the cache rather than the system.
      USE_GATEWAY: "false"
      GATEWAY_CACHE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/flashrank
          key: models-${{ runner.os }}-mpnet-tinybert-v1

      - name: Install deps
        run: |
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-prod.txt
          pip install -r requirements-eval.txt

      - name: Verify dataset integrity before scoring
        run: python -m tools.verify_dataset

      - name: Run evaluation
        run: |
          python -m evals.run_eval \
            --tier "${{ github.event.inputs.tier || 'retrieval' }}" \
            --pace "${{ github.event.inputs.pace || '0' }}"

      - name: Check retrieval against baseline
        run: python -m tools.check_baseline

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-run
          path: evals/runs/
